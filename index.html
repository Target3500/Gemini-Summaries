<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة Submucosa</title>
  <style>
    :root {
      --bg: #051610;
      --card-bg: #09241b;
      --card-border: #134e38;
      --title: #4ade80;
      --text: #d1fae5;
      --text-muted: #86efac;
      --accent: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 30px 16px 80px; min-height: 100vh; }
    header { text-align: center; max-width: 800px; margin: 0 auto 25px; }
    h1 { color: var(--title); margin-bottom: 8px; font-size: 2rem; }
    p { color: var(--text-muted); }

    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    details {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
    }
    summary {
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.15rem;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▼"; font-size: 0.8rem; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(180deg); }

    .lectures-list {
      padding: 10px 18px 18px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lecture-btn {
      width: 100%;
      text-align: right;
      padding: 10px 14px;
      background: #061c15;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text);
      transition: 0.2s;
    }
    .lecture-btn:hover { border-color: var(--accent); background: #0c3326; color: #fff; }

    /* شاشة عرض المحاضرة */
    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      flex-direction: column;
    }
    .viewer-header {
      background: #09241b;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }
    .btn-close {
      background: #134e38;
      color: #fff;
      border: 1px solid var(--title);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-close:hover { background: var(--accent); }
    .viewer iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <h1>منصة Submucosa</h1>
    <p>اختر المادة ثم اضغط على المحاضرة لعرض الملخص</p>
    <p style="font-size: 0.88rem; color: #4ade80; margin-top: 8px; direction: ltr;">
      🛠️ Developer: <strong>Ayman Yousry</strong>
    </p>
  </header>

  <main class="container" id="foldersContainer">
    <p style="text-align: center; color: var(--text-muted);">جاري تحميل المحتوى...</p>
  </main>

  <!-- شاشة عرض المحاضرة -->
  <div class="viewer" id="viewer">
    <div class="viewer-header">
      <span id="viewerTitle" style="color: var(--title); font-weight: bold;"></span>
      <button class="btn-close" onclick="closeViewer()">✕ إغلاق الملخص</button>
    </div>
    <iframe id="lectureFrame"></iframe>
  </div>

  <script>
    // جلب البيانات من ملف data.json مباشرة
    fetch('data.json')
      .then(response => {
        if (!response.ok) throw new Error('تعذر تحميل ملف data.json');
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('foldersContainer');
        container.innerHTML = '';

        if (!data || data.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">لا توجد مواد مضافة حتى الآن.</p>';
          return;
        }

        data.forEach(item => {
          const details = document.createElement('details');

          const summary = document.createElement('summary');
          summary.textContent = item.folder;
          summary.style.color = item.color || 'var(--title)';

          const list = document.createElement('div');
          list.className = 'lectures-list';

          if (!item.lectures || item.lectures.length === 0) {
            list.innerHTML = '<span style="color: #6ee7b7; font-size: 0.9rem;">لا توجد محاضرات في هذه المادة بعد.</span>';
          } else {
            item.lectures.forEach(lec => {
              const btn = document.createElement('button');
              btn.className = 'lecture-btn';
              btn.textContent = lec.title;
              if (lec.color) btn.style.color = lec.color;
              btn.onclick = () => openLecture(lec.title, lec.path);
              list.appendChild(btn);
            });
          }

          details.appendChild(summary);
          details.appendChild(list);
          container.appendChild(details);
        });
      })
      .catch(error => {
        console.error(error);
        document.getElementById('foldersContainer').innerHTML = 
          '<p style="text-align: center; color: #ef4444;">حدث خطأ في تحميل البيانات، تأكد من وجود ملف data.json في المستودع.</p>';
      });

    function openLecture(title, path) {
      document.getElementById('viewerTitle').textContent = title;
      document.getElementById('lectureFrame').src = path;
      document.getElementById('viewer').style.display = 'flex';
    }

    function closeViewer() {
      document.getElementById('viewer').style.display = 'none';
      document.getElementById('lectureFrame').src = '';
    }
  </script>
</body>
</html>

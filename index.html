<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة Submucosa</title>
  <style>
    :root {
      --bg: #051610;
      --card-bg: #09241b;
      --card-border: #134e38;
      --title: #4ade80;
      --text: #d1fae5;
      --text-muted: #86efac;
      --accent: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 30px 16px 80px; min-height: 100vh; }
    header { text-align: center; max-width: 800px; margin: 0 auto 25px; }
    h1 { color: var(--title); margin-bottom: 8px; font-size: 2rem; }
    p { color: var(--text-muted); }

    /* شريط المشرف وأزرار التحكم - مخفية تماماً حتى وضع التوكن */
    .admin-bar {
      max-width: 800px;
      margin: 0 auto 20px;
      display: none;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .folder-controls { display: none; gap: 4px; }
    .item-controls { display: none; gap: 4px; }

    /* إظهار كل الأزرار فقط في حال وجود كلاس is-admin */
    body.is-admin .admin-bar { display: flex; }
    body.is-admin .folder-controls { display: flex; }
    body.is-admin .item-controls { display: flex; }

    .btn {
      background: #134e38;
      color: #fff;
      border: 1px solid var(--title);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      font-size: 0.9rem;
    }
    .btn:hover { background: var(--accent); }
    .btn-icon { padding: 4px 8px; font-size: 0.8rem; background: #061c15; border-color: var(--card-border); }
    .btn-danger { border-color: var(--danger); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    details {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
    }
    summary {
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1.15rem;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▼"; font-size: 0.8rem; transition: transform 0.2s; }
    details[open] summary::after { transform: rotate(180deg); }

    .folder-header-left { display: flex; align-items: center; gap: 8px; }

    .lectures-list {
      padding: 10px 18px 18px;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lecture-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #061c15;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 4px 8px;
      transition: 0.2s;
    }
    .lecture-item:hover { border-color: var(--accent); }
    .lecture-btn {
      flex: 1;
      text-align: right;
      padding: 8px;
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 1rem;
    }

    /* النوافذ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-content input, .modal-content select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: #061c15;
      color: var(--text);
      font-family: inherit;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

    /* عارض المحاضرة */
    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      flex-direction: column;
    }
    .viewer-header {
      background: #09241b;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
    }
    .viewer iframe { width: 100%; height: 100%; border: none; }

    .admin-toggle {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.3);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }
    .admin-toggle:hover { color: #fff; border-color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>منصة Submucosa</h1>
    <p>اختر المادة ثم اضغط على المحاضرة لعرض الملخص</p>
    <p style="font-size: 0.88rem; color: #4ade80; margin-top: 8px; direction: ltr;">
      🛠️ Developer: <strong>Ayman Yousry</strong>
    </p>
  </header>

  <!-- شريط المشرف -->
  <div class="admin-bar">
    <button class="btn" onclick="openCreateFolder()">+ إضافة مادة (Folder)</button>
    <button class="btn" onclick="openCreateLecture()">+ إضافة محاضرة (File)</button>
    <button class="btn btn-danger" onclick="logoutAdmin()">قفل وضع الإدارة</button>
  </div>

  <main class="container" id="foldersContainer">
    <p style="text-align: center; color: var(--text-muted);">جاري تحميل المحتوى...</p>
  </main>

  <!-- نافذة مادة -->
  <div class="modal" id="folderModal">
    <div class="modal-content">
      <h3 id="folderModalTitle" style="color: var(--title);">بيانات المادة</h3>
      <input type="hidden" id="editFolderIdx">
      <input type="text" id="folderName" placeholder="اسم المادة (مثال: تشريح)">
      <label>لون العنوان:</label>
      <input type="color" id="folderColor" value="#4ade80">
      <div class="modal-actions">
        <button class="btn" id="saveFolderBtn" onclick="saveFolder()">حفظ ونشر</button>
        <button class="btn" onclick="closeModal('folderModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- نافذة محاضرة -->
  <div class="modal" id="fileModal">
    <div class="modal-content">
      <h3 id="fileModalTitle" style="color: var(--title);">بيانات المحاضرة</h3>
      <input type="hidden" id="editLecFolderIdx">
      <input type="hidden" id="editLecIdx">
      <select id="targetFolder"></select>
      <input type="text" id="fileName" placeholder="اسم المحاضرة">
      <input type="text" id="filePath" placeholder="مسار الملف في GitHub (مثال: Anatomy/Lec1.html)">
      <div class="modal-actions">
        <button class="btn" id="saveFileBtn" onclick="saveLecture()">حفظ ونشر</button>
        <button class="btn" onclick="closeModal('fileModal')">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- عارض المحاضرة -->
  <div class="viewer" id="viewer">
    <div class="viewer-header">
      <span id="viewerTitle" style="color: var(--title); font-weight: bold;"></span>
      <button class="btn" onclick="closeViewer()">✕ إغلاق الملخص</button>
    </div>
    <iframe id="lectureFrame"></iframe>
  </div>

  <!-- زر مخفي شكلياً في الزاوية للمشرف -->
  <button class="admin-toggle" onclick="promptAdmin()" title="تسجيل الدخول للمشرف">🔒 دخول المشرف</button>

  <script>
    const REPO_OWNER = "Target3500";
    const REPO_NAME = "Gemini-Summaries";
    const FILE_PATH = "data.json";

    let data = [];

    // فحص هل التوكن موجود مسبقاً
    if (localStorage.getItem('gh_token')) {
      document.body.classList.add('is-admin');
    }

    function promptAdmin() {
      if (localStorage.getItem('gh_token')) {
        alert('أنت في وضع الإدارة بالفعل.');
        return;
      }
      const token = prompt('أدخل GitHub Personal Access Token الخاص بك:');
      if (token && token.trim() !== '') {
        localStorage.setItem('gh_token', token.trim());
        document.body.classList.add('is-admin');
        render();
        alert('تم تفعيل وضع المشرف بنجاح! ظهرت أدوات التعديل والإضافة.');
      }
    }

    function logoutAdmin() {
      localStorage.removeItem('gh_token');
      document.body.classList.remove('is-admin');
      render();
      alert('تم قفل وضع الإدارة وإخفاء الأزرار.');
    }

    function loadData() {
      fetch(`${FILE_PATH}?t=${Date.now()}`)
        .then(res => res.json())
        .then(json => {
          data = json;
          render();
        })
        .catch(err => {
          document.getElementById('foldersContainer').innerHTML = '<p style="text-align: center; color: var(--danger);">تعذر تحميل data.json، تأكد من وجوده في المستودع.</p>';
        });
    }

    function render() {
      const container = document.getElementById('foldersContainer');
      const select = document.getElementById('targetFolder');
      container.innerHTML = '';
      select.innerHTML = '';

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">لا توجد مواد بعد.</p>';
        return;
      }

      data.forEach((folder, fIdx) => {
        const opt = document.createElement('option');
        opt.value = fIdx;
        opt.textContent = folder.folder;
        select.appendChild(opt);

        const details = document.createElement('details');
        details.open = true;

        const summary = document.createElement('summary');
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = folder.folder;
        nameSpan.style.color = folder.color || 'var(--title)';

        const leftDiv = document.createElement('div');
        leftDiv.className = 'folder-header-left';

        // عناصر التحكم للمادة (مخفية إلا مع التوكن)
        const fControls = document.createElement('div');
        fControls.className = 'folder-controls';
        fControls.innerHTML = `
          <button class="btn btn-icon" onclick="event.stopPropagation(); moveFolder(${fIdx}, -1)" title="رفع للأعلى">▲</button>
          <button class="btn btn-icon" onclick="event.stopPropagation(); moveFolder(${fIdx}, 1)" title="إنزال للأسفل">▼</button>
          <button class="btn btn-icon" onclick="event.stopPropagation(); editFolder(${fIdx})" title="تعديل">✏️</button>
          <button class="btn btn-icon btn-danger" onclick="event.stopPropagation(); deleteFolder(${fIdx})" title="حذف">🗑️</button>
        `;

        leftDiv.appendChild(fControls);
        summary.appendChild(nameSpan);
        summary.appendChild(leftDiv);

        const list = document.createElement('div');
        list.className = 'lectures-list';

        if (!folder.lectures || folder.lectures.length === 0) {
          list.innerHTML = '<span style="color: #6ee7b7; font-size: 0.9rem;">لا توجد محاضرات في هذه المادة بعد.</span>';
        } else {
          folder.lectures.forEach((lec, lIdx) => {
            const item = document.createElement('div');
            item.className = 'lecture-item';

            const btn = document.createElement('button');
            btn.className = 'lecture-btn';
            btn.textContent = lec.title;
            btn.onclick = () => openLecture(lec.title, lec.path);

            // عناصر التحكم للمحاضرة (مخفية إلا مع التوكن)
            const iControls = document.createElement('div');
            iControls.className = 'item-controls';
            iControls.innerHTML = `
              <button class="btn btn-icon" onclick="moveLecture(${fIdx}, ${lIdx}, -1)" title="رفع للأعلى">▲</button>
              <button class="btn btn-icon" onclick="moveLecture(${fIdx}, ${lIdx}, 1)" title="إنزال للأسفل">▼</button>
              <button class="btn btn-icon" onclick="editLecture(${fIdx}, ${lIdx})" title="تعديل">✏️</button>
              <button class="btn btn-icon btn-danger" onclick="deleteLecture(${fIdx}, ${lIdx})" title="حذف">🗑️</button>
            `;

            item.appendChild(btn);
            item.appendChild(iControls);
            list.appendChild(item);
          });
        }

        details.appendChild(summary);
        details.appendChild(list);
        container.appendChild(details);
      });
    }

    async function syncToGitHub() {
      const token = localStorage.getItem('gh_token');
      if (!token) return alert('غير مصرح لك، سجل الدخول أولاً بالتوكن');

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const fileInfo = await getRes.json();
        const sha = fileInfo.sha;

        const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

        const putRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: "Update data via Admin UI",
            content: contentBase64,
            sha: sha
          })
        });

        if (!putRes.ok) throw new Error('فشل الحفظ في GitHub، تأكد من صحة التوكن.');

        render();
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      }
    }

    // إدارة المواد
    function openCreateFolder() {
      document.getElementById('editFolderIdx').value = '';
      document.getElementById('folderName').value = '';
      document.getElementById('folderColor').value = '#4ade80';
      document.getElementById('folderModalTitle').textContent = 'إضافة مادة جديدة';
      openModal('folderModal');
    }

    function editFolder(idx) {
      const f = data[idx];
      document.getElementById('editFolderIdx').value = idx;
      document.getElementById('folderName').value = f.folder;
      document.getElementById('folderColor').value = f.color || '#4ade80';
      document.getElementById('folderModalTitle').textContent = 'تعديل بيانات المادة';
      openModal('folderModal');
    }

    async function saveFolder() {
      const idx = document.getElementById('editFolderIdx').value;
      const name = document.getElementById('folderName').value.trim();
      const color = document.getElementById('folderColor').value;
      if (!name) return alert('يرجى كتابة اسم المادة');

      if (idx !== '') {
        data[idx].folder = name;
        data[idx].color = color;
      } else {
        data.push({ folder: name, color: color, lectures: [] });
      }

      closeModal('folderModal');
      await syncToGitHub();
    }

    async function deleteFolder(idx) {
      if (!confirm('هل تريد بالتأكيد حذف هذه المادة وجميع محاضراتها؟')) return;
      data.splice(idx, 1);
      await syncToGitHub();
    }

    async function moveFolder(idx, direction) {
      const target = idx + direction;
      if (target < 0 || target >= data.length) return;
      const temp = data[idx];
      data[idx] = data[target];
      data[target] = temp;
      await syncToGitHub();
    }

    // إدارة المحاضرات
    function openCreateLecture() {
      document.getElementById('editLecFolderIdx').value = '';
      document.getElementById('editLecIdx').value = '';
      document.getElementById('fileName').value = '';
      document.getElementById('filePath').value = '';
      document.getElementById('fileModalTitle').textContent = 'إضافة محاضرة جديدة';
      openModal('fileModal');
    }

    function editLecture(fIdx, lIdx) {
      const lec = data[fIdx].lectures[lIdx];
      document.getElementById('editLecFolderIdx').value = fIdx;
      document.getElementById('editLecIdx').value = lIdx;
      document.getElementById('targetFolder').value = fIdx;
      document.getElementById('fileName').value = lec.title;
      document.getElementById('filePath').value = lec.path;
      document.getElementById('fileModalTitle').textContent = 'تعديل بيانات المحاضرة';
      openModal('fileModal');
    }

    async function saveLecture() {
      const fIdx = document.getElementById('editLecFolderIdx').value;
      const lIdx = document.getElementById('editLecIdx').value;
      const targetFIdx = document.getElementById('targetFolder').value;
      const title = document.getElementById('fileName').value.trim();
      const path = document.getElementById('filePath').value.trim();

      if (!title || !path) return alert('يرجى ملء الاسم ومسار الملف');

      if (fIdx !== '' && lIdx !== '') {
        if (fIdx !== targetFIdx) {
          data[fIdx].lectures.splice(lIdx, 1);
          data[targetFIdx].lectures.push({ title, path });
        } else {
          data[fIdx].lectures[lIdx] = { title, path };
        }
      } else {
        data[targetFIdx].lectures.push({ title, path });
      }

      closeModal('fileModal');
      await syncToGitHub();
    }

    async function deleteLecture(fIdx, lIdx) {
      if (!confirm('هل تريد حذف هذه المحاضرة؟')) return;
      data[fIdx].lectures.splice(lIdx, 1);
      await syncToGitHub();
    }

    async function moveLecture(fIdx, lIdx, direction) {
      const target = lIdx + direction;
      const lecs = data[fIdx].lectures;
      if (target < 0 || target >= lecs.length) return;
      const temp = lecs[lIdx];
      lecs[lIdx] = lecs[target];
      lecs[target] = temp;
      await syncToGitHub();
    }

    function openLecture(title, path) {
      document.getElementById('viewerTitle').textContent = title;
      document.getElementById('lectureFrame').src = path;
      document.getElementById('viewer').style.display = 'flex';
    }

    function closeViewer() {
      document.getElementById('viewer').style.display = 'none';
      document.getElementById('lectureFrame').src = '';
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    loadData();
  </script>
</body>
</html>
